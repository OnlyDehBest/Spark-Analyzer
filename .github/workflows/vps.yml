name: vps

# Aggiorna Spark Resource Analyzer sulla VPS: scarica l'ultimo eseguibile Linux della
# release «latest» e riavvia il servizio. Si lancia a mano (Actions → vps → Run workflow)
# oppure da solo dopo ogni build riuscita su main, se i secret sono configurati.
#
# Secret da impostare in Settings → Secrets and variables → Actions:
#   VPS_HOST      indirizzo della VPS (es. 1.2.3.4 o vps.example.com)
#   VPS_USER      utente SSH (es. root)
#   VPS_SSH_KEY   chiave privata SSH (contenuto completo)   oppure
#   VPS_PASSWORD  password SSH (meno sicura della chiave)
# Facoltativi:
#   VPS_PORT      porta SSH (predefinita 22)
#   VPS_PATH      percorso dell'eseguibile (predefinito /opt/spark-analyzer/spark-analyzer)
#   VPS_RESTART   comando di riavvio (predefinito: systemctl restart spark-analyzer)

on:
  workflow_dispatch:
  workflow_run:
    workflows: [build]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: vps
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Controlla la configurazione
        id: cfg
        env:
          HOST: ${{ secrets.VPS_HOST }}
        run: |
          if [ -z "$HOST" ]; then
            echo "::warning::Secret VPS_HOST non impostato: deploy sulla VPS saltato"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Aggiorna e riavvia
        if: steps.cfg.outputs.ok == 'true'
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          KEY: ${{ secrets.VPS_SSH_KEY }}
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
          PORT: ${{ secrets.VPS_PORT }}
          DEST: ${{ secrets.VPS_PATH }}
          RESTART: ${{ secrets.VPS_RESTART }}
          URL: https://github.com/${{ github.repository }}/releases/download/latest/spark-analyzer-linux-x64
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          PORT="${PORT:-22}"
          if [ -n "$KEY" ]; then
            printf '%s\n' "$KEY" > ~/.ssh/id
            chmod 600 ~/.ssh/id
            SSH=(ssh -i ~/.ssh/id)
          elif [ -n "$SSHPASS" ]; then
            sudo apt-get install -y -qq sshpass >/dev/null
            SSH=(sshpass -e ssh -o PubkeyAuthentication=no)
          else
            echo "::error::Imposta il secret VPS_SSH_KEY oppure VPS_PASSWORD"
            exit 1
          fi
          DEST="${DEST:-/opt/spark-analyzer/spark-analyzer}"
          cat > remote.sh <<'SCRIPT'
          set -e
          DEST="$1"; URL="$2"; RESTART="$3"
          d=$(dirname "$DEST"); mkdir -p "$d"
          curl -fsSL -o "$DEST.new" "$URL"
          chmod +x "$DEST.new"
          "$DEST.new" --version >/dev/null
          # processo in esecuzione con questo eseguibile (comando e cartella, per riavviarlo uguale)
          PID=""
          for p in /proc/[0-9]*; do
            exe=$(readlink "$p/exe" 2>/dev/null || true)
            if [ "${exe% (deleted)}" = "$DEST" ]; then PID=${p#/proc/}; break; fi
          done
          [ -f "$DEST" ] && cp "$DEST" "$DEST.old" || true
          mv -f "$DEST.new" "$DEST"
          if [ -n "$RESTART" ]; then
            sh -c "$RESTART"
          elif systemctl cat spark-analyzer >/dev/null 2>&1; then
            systemctl restart spark-analyzer
          else
            if [ -n "$PID" ]; then
              ARGS=$(tr '\0' '\n' < /proc/$PID/cmdline | tail -n +2 | sed 's/.*/"&"/' | tr '\n' ' ')
              CWD=$(readlink /proc/$PID/cwd)
            else
              ARGS='serve --host 0.0.0.0 --port 8085 --no-open'
              CWD="$d"
            fi
            printf '%s\n' "[Unit]" "Description=Spark Resource Analyzer" "After=network-online.target" "" \
              "[Service]" "WorkingDirectory=$CWD" "ExecStart=$DEST $ARGS" "Restart=always" "RestartSec=3" "" \
              "[Install]" "WantedBy=multi-user.target" > /etc/systemd/system/spark-analyzer.service
            systemctl daemon-reload
            [ -n "$PID" ] && kill "$PID" 2>/dev/null || true
            sleep 1
            systemctl enable --now spark-analyzer
            echo "servizio systemd spark-analyzer creato: ExecStart=$DEST $ARGS (cartella $CWD)"
          fi
          sleep 3
          systemctl is-active spark-analyzer 2>/dev/null || pgrep -fa "$DEST" || true
          echo "aggiornato: $(ls -la "$DEST")"
          SCRIPT
          sed -i 's/^          //' remote.sh
          "${SSH[@]}" -p "$PORT" -o StrictHostKeyChecking=accept-new "$USER@$HOST" \
            "bash -s -- '$DEST' '$URL' '$RESTART'" < remote.sh
