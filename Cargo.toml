[workspace]
members = [".", "web"]

[package]
name = "sparkscope"
version = "1.0.0"
edition = "2024"
description = "Analisi approfondita dei profili spark (Minecraft) per trovare la causa del lag e le soluzioni"
license = "GPL-3.0-only"
readme = "README.md"
keywords = ["minecraft", "spark", "profiler", "lag", "paper"]
categories = ["command-line-utilities", "development-tools::profiling"]

[[bin]]
name = "sparkscope"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = ["dep:getrandom", "dep:ureq", "dep:tiny_http", "dep:webbrowser", "dep:comfy-table", "dep:owo-colors", "dep:inferno", "dep:clap"]

[lib]
name = "sparkscope"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"], optional = true }
comfy-table = { version = "8", optional = true }
flate2 = "1"
getrandom = { version = "0.3", optional = true }
inferno = { version = "0.12", default-features = false, optional = true }
owo-colors = { version = "4", features = ["supports-colors"], optional = true }
prost = "0.14"
regex = "1"
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = { version = "0.12", optional = true }
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"], optional = true }
webbrowser = { version = "1", optional = true }

[build-dependencies]
prost-build = "0.14"
protox = "0.10"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
