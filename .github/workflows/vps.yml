name: vps

# Aggiorna Spark Resource Analyzer sulla VPS: scarica l'ultimo eseguibile Linux della
# release «latest» e riavvia il servizio. Si lancia a mano (Actions → vps → Run workflow)
# oppure da solo dopo ogni build riuscita su main, se i secret sono configurati.
#
# Secret da impostare in Settings → Secrets and variables → Actions:
#   VPS_HOST      indirizzo della VPS (es. 1.2.3.4 o vps.example.com)
#   VPS_USER      utente SSH (es. root)
#   VPS_SSH_KEY   chiave privata SSH (contenuto completo)   oppure
#   VPS_PASSWORD  password SSH (meno sicura della chiave)
# Facoltativi:
#   VPS_PORT      porta SSH (predefinita 22)
#   VPS_PATH      percorso dell'eseguibile, se non gira già come servizio systemd
#                 (predefinito /opt/spark-analyzer/spark-analyzer)
#   VPS_RESTART   comando di riavvio personalizzato
# Senza VPS_RESTART il workflow trova da solo il servizio systemd che esegue
# «sparkscope serve» o «spark-analyzer serve», aggiorna quell'eseguibile e lo riavvia.

on:
  workflow_dispatch:
  workflow_run:
    workflows: [build]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: vps
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Controlla la configurazione
        id: cfg
        env:
          HOST: ${{ secrets.VPS_HOST }}
        run: |
          if [ -z "$HOST" ]; then
            echo "::warning::Secret VPS_HOST non impostato: deploy sulla VPS saltato"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Aggiorna e riavvia
        if: steps.cfg.outputs.ok == 'true'
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          KEY: ${{ secrets.VPS_SSH_KEY }}
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
          PORT: ${{ secrets.VPS_PORT }}
          DEST: ${{ secrets.VPS_PATH }}
          RESTART: ${{ secrets.VPS_RESTART }}
          URL: https://github.com/${{ github.repository }}/releases/download/latest/spark-analyzer-linux-x64
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          PORT="${PORT:-22}"
          if [ -n "$KEY" ]; then
            printf '%s\n' "$KEY" > ~/.ssh/id
            chmod 600 ~/.ssh/id
            SSH=(ssh -i ~/.ssh/id)
          elif [ -n "$SSHPASS" ]; then
            sudo apt-get install -y -qq sshpass >/dev/null
            SSH=(sshpass -e ssh -o PubkeyAuthentication=no)
          else
            echo "::error::Imposta il secret VPS_SSH_KEY oppure VPS_PASSWORD"
            exit 1
          fi
          DEST="${DEST:-/opt/spark-analyzer/spark-analyzer}"
          cat > remote.sh <<'SCRIPT'
          set -e
          DEST="$1"; URL="$2"; RESTART="$3"
          UNIT=""
          OURS=/etc/systemd/system/spark-analyzer.service
          if [ -z "$RESTART" ]; then
            # servizio systemd che sta già eseguendo l'analyzer: si aggiorna proprio quel file
            pref=""; other=""
            for p in /proc/[0-9]*; do
              exe=$(readlink "$p/exe" 2>/dev/null) || continue
              exe=${exe% (deleted)}
              case "${exe##*/}" in sparkscope|spark-analyzer) ;; *) continue ;; esac
              [ "$(tr '\0' '\n' < "$p/cmdline" 2>/dev/null | sed -n 2p)" = serve ] || continue
              u=$(grep -o '[^/]*\.service' "$p/cgroup" 2>/dev/null | tail -1 || true)
              [ -n "$u" ] || continue
              if [ "$u" = spark-analyzer.service ]; then other="$exe|$u"; else pref="$exe|$u"; fi
            done
            best=${pref:-$other}
            if [ -n "$best" ]; then DEST=${best%%|*}; UNIT=${best#*|}; fi
          fi
          echo "eseguibile: $DEST  servizio: ${UNIT:-nessuno}"
          d=$(dirname "$DEST"); mkdir -p "$d"
          curl -fsSL -o "$DEST.new" "$URL"
          chmod +x "$DEST.new"
          "$DEST.new" --version >/dev/null
          [ -f "$DEST" ] && cp "$DEST" "$DEST.old" || true
          mv -f "$DEST.new" "$DEST"
          if [ -n "$RESTART" ]; then
            sh -c "$RESTART"
          elif [ -n "$UNIT" ]; then
            systemctl restart "$UNIT"
          else
            printf '%s\n' "[Unit]" "Description=Spark Resource Analyzer" "After=network-online.target" "" \
              "[Service]" "WorkingDirectory=$d" "ExecStart=$DEST serve --host 0.0.0.0 --port 8085 --no-open" \
              "Restart=always" "RestartSec=3" "" "[Install]" "WantedBy=multi-user.target" > "$OURS"
            systemctl daemon-reload
            systemctl enable --now spark-analyzer
            UNIT=spark-analyzer.service
            echo "creato il servizio systemd spark-analyzer"
          fi
          # copia creata in automatico da un deploy precedente mentre ne girava già un'altra: si rimuove
          if [ "$UNIT" != spark-analyzer.service ] && [ -f "$OURS" ] && grep -q '^Description=Spark Resource Analyzer$' "$OURS"; then
            old=$(sed -n 's/^ExecStart=\([^ ]*\).*/\1/p' "$OURS")
            systemctl disable --now spark-analyzer 2>/dev/null || true
            rm -f "$OURS"; systemctl daemon-reload
            if [ -n "$old" ] && [ "$old" != "$DEST" ]; then
              rm -f "$old" "$old.old"; rmdir "$(dirname "$old")" 2>/dev/null || true
            fi
            echo "rimossa la copia duplicata ($old)"
          fi
          sleep 3
          [ -n "$UNIT" ] && echo "$UNIT: $(systemctl is-active "$UNIT" || true)"
          ss -ltnp 2>/dev/null | grep -E 'sparkscope|spark-analyzer' || true
          [ -n "$UNIT" ] && journalctl -u "$UNIT" -n 20 --no-pager 2>/dev/null | grep -iE "report salvati|reports saved|impossibile salvare|cannot save" | tail -1 || true
          echo "aggiornato: $(ls -la "$DEST")"
          SCRIPT
          sed -i 's/^          //' remote.sh
          "${SSH[@]}" -p "$PORT" -o StrictHostKeyChecking=accept-new "$USER@$HOST" \
            "bash -s -- '$DEST' '$URL' '$RESTART'" < remote.sh
