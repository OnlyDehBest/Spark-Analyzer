[package]
name = "spark-resource-analyzer-bot"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false
description = "Bot Discord di Spark Resource Analyzer: analizza i profili spark incollati nei canali"

[dependencies]
sparkscope = { path = ".." }
serenity = { version = "0.12.5", default-features = false, features = ["client", "gateway", "model", "http", "native_tls_backend", "cache"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
serde_json = "1"
anyhow = "1"
regex = "1"
ureq = { version = "3", default-features = false, features = ["rustls"] }
