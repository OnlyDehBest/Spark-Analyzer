name: sito

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add wasm32-unknown-unknown
      - name: Test
        run: cargo test --workspace
      - name: Compila il modulo WebAssembly
        run: cargo build -p sparkscope-web --lib --release --target wasm32-unknown-unknown
      - name: Installa wasm-bindgen
        run: |
          version=$(cargo metadata --format-version 1 | jq -r '.packages[] | select(.name == "wasm-bindgen") | .version')
          cargo install wasm-bindgen-cli --version "$version" --locked
      - name: Genera il sito
        run: |
          cargo run -p sparkscope-web --example build_site -- site
          wasm-bindgen target/wasm32-unknown-unknown/release/sparkscope_web.wasm --target web --out-dir site/pkg --no-typescript
      - name: Ottimizza il WebAssembly (wasm-opt)
        continue-on-error: true
        run: |
          sudo apt-get install -y -qq binaryen >/dev/null
          wasm-opt --version
          f=site/pkg/sparkscope_web_bg.wasm
          if wasm-opt -O3 --enable-bulk-memory --enable-nontrapping-float-to-int --enable-sign-ext --enable-mutable-globals --enable-reference-types --enable-multivalue "$f" -o "$f.opt"; then
            mv "$f.opt" "$f"
          else
            echo "::warning::wasm-opt non riuscito, uso il modulo non ottimizzato"
          fi
          ls -la site/pkg
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
