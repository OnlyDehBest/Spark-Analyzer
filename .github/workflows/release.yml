name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable --no-self-update && rustup default stable
      - run: cargo test --workspace

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: sparkscope
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: sparkscope.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: sparkscope
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: rustup update stable --no-self-update && rustup default stable && rustup target add ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - shell: bash
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/${{ matrix.bin }} dist/sparkscope-${{ matrix.target }}${{ endsWith(matrix.bin, '.exe') && '.exe' || '' }}
      - shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" --title "${{ github.ref_name }}" --generate-notes 2>/dev/null || true; gh release upload "${{ github.ref_name }}" dist/* --repo "${{ github.repository }}" --clobber
