name: versione

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Crea il tag dalla versione in Cargo.toml
        id: v
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "sparkscope") | .version')
          tag="v${version}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          if git rev-parse "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Il tag ${tag} esiste già: ricompilo la release"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${tag}" -m "Spark Resource Analyzer ${tag}"
            git push origin "${tag}"
          fi
      - name: Avvia la build della release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --repo "${{ github.repository }}" --ref "${{ steps.v.outputs.tag }}"
